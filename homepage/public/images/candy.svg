  <path d="M210 178h30M398 178h30" stroke="#547462" stroke-width="1.3" marker-end="url(#arrow)"/>
  <g stroke="#547462" stroke-width="1.5">
    <rect x="102" y="136" width="23" height="23" rx="5" fill="#dce6de"/>
    <rect x="139" y="136" width="23" height="23" rx="5"/>
    <rect x="102" y="173" width="23" height="23" rx="5"/>
    <rect x="139" y="173" width="23" height="23" rx="5"/>
  </g>
